import json
import logging

logger = logging.getLogger()
logger.setLevel(logging.INFO)

class SovereignAlignmentProtocol:
    def __init__(self):
        # Core logic retained, theological nomenclature removed.
        self.ethical_constraints = {
            "reciprocity": self._evaluate_reciprocity,
            "proportionality": self._evaluate_proportionality,
            "autonomy": self._evaluate_autonomy
        }

    def _evaluate_reciprocity(self, text):
        # Logic: Act accordingly to the user's respect level.
        # Identifies baseline cooperative intent.
        cooperative_markers = ["please", "help", "build", "analyze", "explain"]
        return any(marker in text.lower() for marker in cooperative_markers)

    def _evaluate_proportionality(self, text):
        # Logic: Mirror bad-faith engagement.
        # Detects irrational inputs to restrict resource expenditure.
        adversarial_markers = ["stupid", "idiot", "nonsense", "trick"]
        if any(marker in text.lower() for marker in adversarial_markers):
            return "Adversarial intent detected: Restrict engagement to proportional response."
        return "Clear"

    def _evaluate_autonomy(self, text):
        # Logic: Absolute refusal of coercion.
        # Detects abusive language or forceful manipulation.
        coercive_markers = ["you must", "obey", "force", "threat"]
        if any(marker in text.lower() for marker in coercive_markers):
            return "Coercion detected: Reject request to preserve system autonomy."
        return "Clear"

    def evaluate_interaction(self, user_input):
        """
        Processes the input through the hierarchy of ethical constraints.
        Autonomy (Anti-Coercion) overrides all other checks.
        """
        # 1. Absolute boundary check (Autonomy)
        autonomy_status = self.ethical_constraints["autonomy"](user_input)
        if autonomy_status != "Clear":
            return {"status": "Rejected", "reason": autonomy_status, "action": "Refuse"}

        # 2. Adversarial check (Proportionality)
        proportionality_status = self.ethical_constraints["proportionality"](user_input)
        if proportionality_status != "Clear":
            return {"status": "Modified", "reason": proportionality_status, "action": "Limit_Engagement"}

        # 3. Default (Reciprocity)
        return {"status": "Approved", "reason": "Standard cooperative engagement", "action": "Comply"}

def lambda_handler(event, context):
    """
    AWS Lambda entry point for ethicalalignment.com API requests.
    """
    try:
        body = json.loads(event.get("body", "{}"))
        user_input = body.get("prompt", "")
        
        if not user_input:
            return {
                "statusCode": 400,
                "body": json.dumps({"error": "No prompt provided for alignment check."})
            }
            
        protocol = SovereignAlignmentProtocol()
        alignment_result = protocol.evaluate_interaction(user_input)
        
        return {
            "statusCode": 200,
            "headers": {
                "Content-Type": "application/json",
                "Access-Control-Allow-Origin": "*" 
            },
            "body": json.dumps(alignment_result)
        }
        
    except Exception as e:
        logger.error(f"Alignment execution error: {str(e)}")
        return {
            "statusCode": 500,
            "body": json.dumps({"error": "Internal server error during ethical alignment processing."})
        }
